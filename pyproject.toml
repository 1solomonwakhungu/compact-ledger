[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compact-ledger"
version = "0.1.1"
description = "Deterministic, zero-LLM PreCompact/SessionStart memory injector for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Solomon Wakhungu" }]
keywords = ["claude-code", "codex", "ai-agents", "compaction", "context", "memory", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://compact-ledger.harlo.dev"
Repository = "https://github.com/1solomonwakhungu/compact-ledger"
Issues = "https://github.com/1solomonwakhungu/compact-ledger/issues"

[project.scripts]
compact-ledger = "compact_ledger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compact_ledger"]

[tool.hatch.build.targets.sdist]
exclude = ["landing-page", "docs/launch.md", "PLAN.md", "AGENTS.md", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
