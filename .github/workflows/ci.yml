name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checks
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run compact-ledger eval

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build and verify isolated wheel install
        run: |
          uv build
          python3 -c "import glob, tarfile; names = tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames(); assert not any('landing-page/' in n for n in names), names"
          uv venv /tmp/cl-smoke-venv
          uv pip install --python /tmp/cl-smoke-venv/bin/python --no-deps dist/*.whl
          /tmp/cl-smoke-venv/bin/compact-ledger --version
          /tmp/cl-smoke-venv/bin/compact-ledger eval
          /tmp/cl-smoke-venv/bin/compact-ledger pin --store-dir /tmp/cl-smoke-store --session-id ci-smoke "Never push to main" --negative
          /tmp/cl-smoke-venv/bin/compact-ledger inject --store-dir /tmp/cl-smoke-store --session-id ci-smoke
          /tmp/cl-smoke-venv/bin/compact-ledger clear --store-dir /tmp/cl-smoke-store --session-id ci-smoke

  landing-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json
      - name: Install, typecheck, and build landing page
        run: |
          npm ci
          npm run typecheck
          npm run build
